<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tigrinho da Shopee</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/imgs/image-removebg-preview.png" type="image/x-icon">
</head>
<body>
    <img src="assets/imgs/image-removebg-preview.png" alt="">

    <img id="tigrinho" src="assets/imgs/tigrinho.png" alt="">

    <div id="aposta">
        <h1>Aposta</h1>

        <input type="number" id="numeroaposta" placeholder="Digite em qual número você vai apostar:">
        <button id="btn" onclick="mostrarAnimacao()">Apostar</button>

        <div id="ondeficaosaldo">
        <h3>Saldo: &nbsp </h3>
        <h3 id="saldo">3real</h3>
        </div>
    </div>

    <div id="overlay">
        <img id="overlay-img" src="" alt="Animação">
        <div id="overlay-text"></div>
    </div>

    <audio src="assets/audio/Música de fundo.mp3" autoplay loop controls></audio>
    <audio id="audiowin" src="assets/audio/Solta a carta tigrinho.mp3"></audio>
<div #adicionar></div>
    <button id="adicionar" onclick="adicionar()">+1000</button>

    <script src="tigrinho.js"></script>
</body>
</html>
